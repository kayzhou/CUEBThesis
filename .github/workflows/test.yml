name: Compile and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: >-
            scheme-small xetex ctex xecjk fandol tex-gyre latexmk
            biber biblatex biblatex-gb7714-2015 collection-latexextra
          update-all-packages: true
      - name: Install Poppler on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install Poppler on macOS
        if: runner.os == 'macOS'
        run: brew install poppler
      - name: Install Poppler on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install poppler -y --no-progress
          $binary = Get-ChildItem 'C:\ProgramData\chocolatey\lib\poppler' -Recurse -Filter pdftotext.exe | Select-Object -First 1
          if (-not $binary) { throw 'pdftotext.exe was not installed' }
          $binary.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Compile examples
        run: |
          # CI has distributable preview fonts, not the submission font set.
          mkdir -p build
          python - <<'PY'
          from pathlib import Path
          source = Path('main.tex').read_text(encoding='utf-8')
          source = source.replace(r'\input{cuebsetup}', r'\input{cuebsetup}' + '\n' + r'\cuebsetup{font-profile=preview}')
          Path('build/ci-main.tex').write_text(source, encoding='utf-8')
          PY
          latexmk -jobname=main -outdir=build build/ci-main.tex
          latexmk -outdir=build/minimal examples/minimal.tex
      - name: Verify behavior and output
        run: |
          python -m unittest discover -s testfiles -p 'test_*.py'
          python utils/check.py
          python utils/check.py --pdf build/main.pdf
          python utils/check.py --pdf build/minimal/minimal.pdf
      - name: Package distribution
        if: runner.os == 'Linux'
        run: python utils/create_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cueb-results-${{ runner.os }}
          path: |
            build/main.pdf
            build/main.log
            build/minimal/minimal.pdf
            build/checks/**/build-output.txt
            dist/*
